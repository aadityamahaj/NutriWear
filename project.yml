name: NutriWear
options:
  bundleIdPrefix: com.nutriwear
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Relaxed concurrency so the hackathon build is smooth on Swift 6
    SWIFT_STRICT_CONCURRENCY: minimal

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

targets:
  NutriWear:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.nutriwear.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pass the Groq key from xcconfig into Info.plist at build time
        GROQ_API_KEY: $(GROQ_API_KEY)
